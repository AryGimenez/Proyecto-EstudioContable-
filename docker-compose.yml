# docker-compose.yml (Versión Mejorada)

version: '3.8'

services:
  backend:
    build: 
      context: ./backend # Ajustado a la nueva ubicación (asumiendo que docker-compose.yml está en la raíz)
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT_HOST}:8000" # Usa variable de entorno
    depends_on:
      - db
    env_file: .env # Carga las variables de .env
    environment:
      # Pasa la URL de la DB que contiene la contraseña
      - DATABASE_URL=${DATABASE_URL}
    restart: always

  frontend:
    build: 
      context: ./frontend/flutter_gestion_contable
    ports:
      - "${FRONTEND_PORT_HOST}:80" # Usa variable de entorno
    # depends_on: # Se recomienda eliminar esta dependencia para desarrollo.
    #   - backend
    restart: always

  db:
    image: mysql:8.0
    # Usa un bind mount para persistir los datos en una ruta específica en el HOST
    volumes:
      - ${MYSQL_DATA_PATH}:/var/lib/mysql # Usa variable de entorno
    ports:
      - "${DB_PORT_HOST}:3306" # Usa variable de entorno
    env_file: .env # Carga las variables de .env
    environment:
      # Carga las variables desde .env
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD} 
      - MYSQL_DATABASE=${DB_NAME}
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    env_file: .env # Carga las variables de .env
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    depends_on:
      - db
    restart: always

# ❌ ELIMINAR el bloque 'volumes:' al final si solo usas 'bind mounts'
# Si quieres seguir usando volúmenes nombrados, mantén el bloque,
# pero el 'bind mount' de arriba es mejor para saber la ruta en el HOST.
# volumes:
#  mysql_data: